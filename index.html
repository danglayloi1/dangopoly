<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dangopoly: Nghệ Tĩnh Edition</title>
    <meta
      name="description"
      content="Cờ tỷ phú Nghệ Tĩnh: từ quê nhà Hà Tĩnh, qua cầu Bến Thủy, đến thành Vinh. 2–4 người chơi chung một máy, miễn phí trên trình duyệt."
    />
    <meta name="theme-color" content="#d64545" />
    <script>
      // Apply the saved light/dark choice before the page draws (see src/ui/theme.ts).
      try {
        const theme = localStorage.getItem('dangopoly.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The preview shown when the link is shared (Zalo, Messenger, Facebook, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://danglayloi1.github.io/dangopoly/" />
    <meta property="og:title" content="Dangopoly: Nghệ Tĩnh Edition" />
    <meta property="og:description" content="Cờ tỷ phú Nghệ Tĩnh: từ quê nhà Hà Tĩnh, qua cầu Bến Thủy, đến thành Vinh. Chơi miễn phí trên trình duyệt." />
    <meta property="og:image" content="https://danglayloi1.github.io/dangopoly/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
