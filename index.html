<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sân nhởi Nghệ Tĩnh · Dangopoly</title>
    <meta
      name="description"
      content="Trò chơi xứ Nghệ trên trình duyệt: Dangopoly, cờ tỷ phú từ quê nhà Hà Tĩnh qua cầu Bến Thủy đến thành Vinh, và thêm trò mới. Chơi chung một máy hoặc online, miễn phí."
    />
    <meta name="theme-color" content="#d64545" />
    <script>
      // Apply the saved colors before the page draws (see src/ui/theme.ts).
      try {
        const theme = localStorage.getItem('dangopoly.theme');
        if (['light', 'dark', 'tet', 'cham', 'contrast'].includes(theme)) document.documentElement.setAttribute('data-theme', theme);
      } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&family=Water+Brush&display=swap"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The preview shown when the link is shared (Zalo, Messenger, Facebook, …) -->

    <meta property="og:url" content="https://danglayloi1.github.io/dangopoly/" />
