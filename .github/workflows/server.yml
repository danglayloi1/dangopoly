name: Deploy the room server to Cloudflare

# The online room server (server/) runs on Cloudflare Workers. On pushes to main that touch it or
# the game rules it runs, test and deploy it. It needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare dashboard (Workers & Pages → Overview)
# Until they are added, the deploy step is skipped.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/engine/**'
      - 'src/data/**'
      - 'src/net/**'
      - 'src/ui/firstTurn.ts'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p server
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config server/wrangler.jsonc
      - name: No Cloudflare secrets yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository secrets to deploy the room server."
